# 演示站反向代理（阶段 8 遗留问题修复，2026-10-09）。
#
# 作用：应用不再直接暴露端口，由 nginx 在入口用真实连接地址**覆盖**客户端自带的
# X-Forwarded-For / X-Real-IP / X-Forwarded-Host。否则客户端伪造这些头即可让
# src/proxy.ts 的公开限流把每次请求当成新来源（演示站实测可绕过）。
#
# 挂载到容器的 /etc/nginx/conf.d/default.conf。上游名 app:3000 是同一 Compose
# 网络里的应用服务。不含任何主机地址或部署路径。

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 应用自身对 /api/* 限 4 MiB、海报上传 10 MiB（请求体 11 MiB）；这里略放宽，避免 nginx 先以 HTML 413 截断。
    client_max_body_size 12m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 原样转发浏览器访问的主机名（含端口），写接口的来源校验拿它与 Origin 比较。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # 覆盖而不是追加：只留下 nginx 看到的真实对端地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 成绩册 PDF 首次生成约 2 秒；留足余量。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
